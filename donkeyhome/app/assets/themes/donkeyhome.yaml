  ha-color-primary-50: "#F5B8D9"
  ha-color-primary-60: "#F7C6E0"
  ha-color-primary-70: "#F9D3E7"
  ha-color-primary-80: "#FBE2EF"
  ha-color-primary-90: "#FDF0F7"
  ha-color-primary-95: "#FEF8FB"
  ha-color-on-primary-loud: "#2A1220"
  dh-surface-2: "#3A3A3E"
  dh-outline: "#4A4A50"
  dh-pill-bg: "#F4F4F5"
  dh-pill-text: "#141416"
  dh-glow: "rgba(255, 196, 70, 0.11)"
  dh-icon: "#F4F4F5"
  dh-accent-2: "#3CC8D8"
  modes:
    dark:
      primary-background-color: "#1A1A1C"
      secondary-background-color: "#16181D"
      card-background-color: "#2A2A2D"
      ha-card-background: "#2A2A2D"
