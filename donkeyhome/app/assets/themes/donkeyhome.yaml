  accent-color: "#F2A7CF"
  text-primary-color: "#2A1220"
  state-icon-color: "#9A9CA6"
  state-inactive-color: "#6E7180"
  app-header-background-color: "#1A1A1C"
  app-header-text-color: "#F2F2F4"
  app-header-border-bottom: "none"
  app-header-selection-bar-color: "#F2A7CF"
  sidebar-background-color: "#1A1A1C"
  sidebar-text-color: "#F2F2F4"
