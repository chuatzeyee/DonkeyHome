  state-sensor-battery-high-color: "#30D158"
  state-timer-active-color: "#9A9CA6"
  ha-card-border-radius: "28px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255, 255, 255, 0)"
  ha-card-box-shadow: "none"
  ha-section-border-radius: "28px"
  ha-card-features-border-radius: "14px"
  ha-tile-icon-border-radius: "14px"
  ha-section-grid-row-height: "64px"
