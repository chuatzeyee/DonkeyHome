# DonkeyHome themes. "DonkeyHome" is dark, "DonkeyHome Light" is light; the sun/moon button on the
# dashboard switches between them (script.donkeyhome_toggle_theme). Fonts: Google Sans and Instrument Serif,
# served from www/donkeyhome/ (SIL Open Font License); Canela instead of Instrument Serif when its licensed font
# files are there. Colour means "on"; everything off is grey.
DonkeyHome:
  ha-font-family-body: '"Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  ha-font-family-heading: '"Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  dh-font-display: '"Canela", "Instrument Serif", Georgia, serif'
  ha-font-size-scale: "1.1"
  ha-font-weight-heading: "600"
  ha-heading-card-title-font-size: "15px"
  ha-heading-card-title-font-weight: "600"
  ha-heading-card-title-color: "#9A9CA6"
  ha-heading-card-subtitle-font-size: "13px"
  ha-heading-card-subtitle-color: "#6E7180"
  ha-tile-info-primary-font-weight: "600"
  ha-tile-info-primary-letter-spacing: "-0.1px"
  ha-tile-info-secondary-color: "#9A9CA6"
  ha-tile-info-secondary-letter-spacing: "0px"
  ha-badge-size: "40px"
  ha-badge-font-size: "13px"
  primary-background-color: "#1A1A1C"
  secondary-background-color: "#16181D"
  lovelace-background: "#1A1A1C"
  card-background-color: "#2A2A2D"
  ha-card-background: "#2A2A2D"
  mdc-theme-surface: "#2A2A2D"
  primary-text-color: "#F2F2F4"
  secondary-text-color: "#9A9CA6"
  disabled-text-color: "#5C5F6A"
  divider-color: "rgba(255, 255, 255, 0.08)"
